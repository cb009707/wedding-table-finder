<head>

    <style>
        /* Wedding Theme Colors: Blush Pink (#FFC0CB), Gold (#FFD700), Ivory/White (#FFFFF0) */

        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap'); /* More elegant font */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Playfair Display', serif; /* Elegant font */
            background: #f8f8f8; /* Soft Off-White Background */
            /* Subtle texture or pattern could be added here */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: #FFFFF0; /* Ivory container */
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            animation: fadeIn 0.5s ease;
            border: 3px solid #FFD700; /* Gold border for elegance */
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            text-align: center;
            color: #FFC0CB; /* Blush Pink Heading */
            font-size: 36px;
            margin-bottom: 5px;
            font-weight: 700;
            letter-spacing: 2px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
        }

        .subtitle {
            text-align: center;
            color: #555;
            margin-bottom: 30px;
            font-size: 18px;
            font-style: italic;
            border-bottom: 1px dashed #FFC0CB;
            padding-bottom: 15px;
        }

        .search-box {
            position: relative;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 15px 20px;
            font-size: 18px;
            font-family: 'Georgia', serif;
            border: 2px solid #FFC0CB; /* Blush Pink Border */
            border-radius: 5px;
            outline: none;
            transition: all 0.3s;
            color: #333;
        }

        input::placeholder {
            color: #aaa;
        }

        input:focus {
            border-color: #FFD700; /* Gold focus effect */
            box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.2);
        }

        .result {
            text-align: center;
            padding: 30px;
            background: linear-gradient(145deg, #FFC0CB 0%, #FFD700 100%); /* Pink to Gold Gradient */
            border-radius: 10px;
            color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            display: none;
            animation: slideIn 0.4s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .result.show {
            display: block;
        }

        .table-number {
            font-size: 72px;
            font-weight: bold;
            margin: 20px 0;
            color: #ffffff; /* White number */
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .guest-name {
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: 700;
        }
        
        .result > div:first-of-type {
            font-size: 18px;
            margin-bottom: 5px;
        }
        
        .result > div:last-of-type {
            font-size: 20px;
            margin-top: 15px;
            font-style: italic;
        }


        .not-found {
            background: #ff7f7f;
            padding: 20px;
            border-radius: 5px;
            color: white;
            text-align: center;
            display: none;
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .not-found.show {
            display: block;
        }

        .suggestions {
            margin-top: 15px;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #FFC0CB; /* Blush border for suggestions */
            border-radius: 5px;
            background: white;
            display: none;
        }

        .suggestions.show {
            display: block;
        }

        .suggestion-item {
            padding: 12px 20px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            border-bottom: 1px solid #f0f0f0;
            color: #333;
        }

        .suggestion-item:last-child {
            border-bottom: none;
        }

        .suggestion-item:hover {
            background: #fff5e8; /* Light gold/ivory hover */
            color: #FFC0CB; /* Blush pink text on hover */
        }

        .loading {
            text-align: center;
            color: #FFC0CB; /* Blush pink loading text */
            font-style: italic;
            display: none;
        }

        .loading.show {
            display: block;
        }
    </style>
</head>

        const searchInput = document.getElementById('searchInput');
        const suggestions = document.getElementById('suggestions');
        const result = document.getElementById('result');
        const notFound = document.getElementById('notFound');
        const loading = document.getElementById('loading');

        let debounceTimer;

        searchInput.addEventListener('input', function(e) {
            clearTimeout(debounceTimer);
            const query = e.target.value.toLowerCase().trim();
            
            result.classList.remove('show');
            notFound.classList.remove('show');
            
            if (query.length < 2) {
                suggestions.classList.remove('show');
                return;
            }

            debounceTimer = setTimeout(() => {
                const matches = Object.keys(guests)
                    .filter(name => name.includes(query))
                    .slice(0, 5);

                if (matches.length > 0) {
                    suggestions.innerHTML = matches.map(name => 
                        `<div class="suggestion-item" onclick="selectGuest('${name}')">${guests[name].name}</div>`
                    ).join('');
                    suggestions.classList.add('show');
                } else {
                    suggestions.classList.remove('show');
                }
            }, 200);
        });

        function selectGuest(guestKey) {
            const guest = guests[guestKey];
            searchInput.value = guest.name;
            suggestions.classList.remove('show');
            showResult(guest);
        }

        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const query = e.target.value.toLowerCase().trim();
                const guest = guests[query];
                
                suggestions.classList.remove('show');
                
                if (guest) {
                    showResult(guest);
                } else {
                    result.classList.remove('show');
                    notFound.classList.add('show');
                    setTimeout(() => notFound.classList.remove('show'), 3000);
                }
            }
        });

        function showResult(guest) {
            result.innerHTML = `
                <div class="guest-name">${guest.name}</div>
                <div>Your assigned seating area is</div>
                <div class="table-number">${guest.table}</div>
                <div>Enjoy the celebration! 🥂</div>
            `;
            result.classList.add('show');
        }
